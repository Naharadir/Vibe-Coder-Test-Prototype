<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff6ec">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Mewdoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    color-scheme: only light;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    /* board fills the width, but never so tall that the HUD gets pushed off screen */
    --board: min(94vw - var(--safe-l) - var(--safe-r), 100dvh - var(--safe-t) - var(--safe-b) - 150px, 460px);
  }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    position: fixed;
    inset: 0;
    font-family: 'Fredoka', system-ui, sans-serif;
    color: #6b4a3a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 3dvh, 24px);
    padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
    background:
      radial-gradient(circle at 15% 12%, #ffd6e0 0 18%, transparent 19%),
      radial-gradient(circle at 88% 22%, #c9f2e3 0 14%, transparent 15%),
      radial-gradient(circle at 10% 85%, #fff1b8 0 16%, transparent 17%),
      radial-gradient(circle at 90% 88%, #d9d2ff 0 18%, transparent 19%),
      #fff6ec;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .hud {
    width: var(--board);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: clamp(18px, 5.5vw, 24px);
    font-weight: 700;
  }
  .pill {
    background: #fffaf2;
    border-radius: 999px;
    padding: 6px 16px;
    box-shadow: 0 4px 0 #f1e3cf;
  }
  .lives span { display: inline-block; margin-left: 2px; transition: opacity .2s, transform .2s; }
  .lives span.lost { opacity: .25; transform: scale(.8); filter: grayscale(1); }

  .board {
    width: var(--board);
    height: var(--board);
    padding: calc(var(--board) * 0.025);
    border-radius: calc(var(--board) * 0.06);
    touch-action: none;
    background: #ffb38a;
    box-shadow: 0 8px 0 #e8946a, 0 14px 30px rgba(180, 110, 80, 0.25);
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: calc(var(--board) * 0.014);
  }
  .cell {
    position: relative;
    border-radius: 22%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .08s;
  }
  .cell.pressed { transform: scale(.92); }
  .r0 { background: #ffc4d6; box-shadow: inset 0 -4px 0 #f3a3bc; }
  .r1 { background: #b8ecd7; box-shadow: inset 0 -4px 0 #8fd6ba; }
  .r2 { background: #cfc6ff; box-shadow: inset 0 -4px 0 #ada1f2; }
  .r3 { background: #ffe39a; box-shadow: inset 0 -4px 0 #f2c95e; }
  .r4 { background: #aedcff; box-shadow: inset 0 -4px 0 #84c2f0; }
  .r5 { background: #d9f2a0; box-shadow: inset 0 -4px 0 #b9db72; }

  .cell svg { width: 72%; height: 72%; pointer-events: none; }
  .cell .cross { width: 46%; height: 46%; opacity: .55; }
  .cell.miss .cross { opacity: 1; }
  .cell.cat svg { animation: pop .35s ease-out; }
  .cell.miss { animation: shake .3s; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(255, 246, 236, .85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
  }
  .overlay.show { display: flex; }
  .rotate {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #fff6ec;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    z-index: 10;
  }
  .rotate .phone { font-size: 56px; animation: tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%, 100% { transform: rotate(-90deg); } 50% { transform: rotate(0deg); } }
  @media (orientation: landscape) and (max-height: 500px) {
    .rotate { display: flex; }
  }
  .overlay h1 { font-size: 32px; padding: 0 20px; }
  .overlay p { font-size: 20px; }
  .overlay button {
    font: inherit; font-size: 22px; font-weight: 700;
    color: #fff;
    background: #ff8fab;
    border: none;
    border-radius: 999px;
    padding: 12px 32px;
    box-shadow: 0 5px 0 #e56f8e;
    cursor: pointer;
  }
  .overlay button:active { transform: translateY(3px); box-shadow: 0 2px 0 #e56f8e; }
</style>
</head>
<body>
  <div class="hud">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill lives" id="lives"></div>
  </div>
  <div class="board" id="board"></div>

  <div class="rotate">
    <div class="phone">📱</div>
    <div>Turn your phone upright 🐾</div>
  </div>

  <div class="overlay" id="overlay">
    <h1 id="ovTitle"></h1>
    <p id="ovText"></p>
    <button id="again">Play again</button>
  </div>

  <script>
    const SIZE = 6;
    const CATS = 6;
    const MAX_MISSES = 3;
    const POINTS_PER_CAT = 100;
    const DOUBLE_TAP_MS = 300;

    const CAT_SVG = `
      <svg viewBox="0 0 100 100">
        <path d="M18 42 L22 10 L44 28 Z" fill="#f4a259" stroke="#6b4a3a" stroke-width="4" stroke-linejoin="round"/>
        <path d="M82 42 L78 10 L56 28 Z" fill="#f4a259" stroke="#6b4a3a" stroke-width="4" stroke-linejoin="round"/>
        <path d="M25 30 L27 18 L37 27 Z" fill="#ffc4d6"/>
        <path d="M75 30 L73 18 L63 27 Z" fill="#ffc4d6"/>
        <ellipse cx="50" cy="58" rx="36" ry="32" fill="#f4a259" stroke="#6b4a3a" stroke-width="4"/>
        <ellipse cx="36" cy="55" rx="4.5" ry="6" fill="#4a3228"/>
        <ellipse cx="64" cy="55" rx="4.5" ry="6" fill="#4a3228"/>
        <circle cx="37.5" cy="53" r="1.6" fill="#fff"/>
        <circle cx="65.5" cy="53" r="1.6" fill="#fff"/>
        <ellipse cx="26" cy="67" rx="6" ry="3.5" fill="#ff9fb6" opacity=".7"/>
        <ellipse cx="74" cy="67" rx="6" ry="3.5" fill="#ff9fb6" opacity=".7"/>
        <path d="M46 64 L54 64 L50 68 Z" fill="#e5707e"/>
        <path d="M50 68 Q46 74 42 71 M50 68 Q54 74 58 71" fill="none" stroke="#4a3228" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M14 60 L28 62 M14 68 L28 66 M86 60 L72 62 M86 68 L72 66" stroke="#6b4a3a" stroke-width="2" stroke-linecap="round"/>
      </svg>`;
    const CROSS_SVG = (color) => `
      <svg class="cross" viewBox="0 0 100 100">
        <path d="M20 20 L80 80 M80 20 L20 80" stroke="${color}" stroke-width="16" stroke-linecap="round"/>
      </svg>`;

    // ---------- puzzle generation ----------
    const rnd = (n) => Math.floor(Math.random() * n);
    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    function placeCats() {
      while (true) {
        const rows = shuffle([...Array(SIZE).keys()]).slice(0, CATS);
        const cols = shuffle([...Array(SIZE).keys()]).slice(0, CATS);
        const cats = rows.map((r, i) => [r, cols[i]]);
        let ok = true;
        for (let i = 0; i < CATS && ok; i++)
          for (let j = i + 1; j < CATS; j++)
            if (Math.abs(cats[i][0] - cats[j][0]) <= 1 && Math.abs(cats[i][1] - cats[j][1]) <= 1) { ok = false; break; }
        if (ok) return cats;
      }
    }

    function growRegions(cats) {
      const reg = Array.from({ length: SIZE }, () => Array(SIZE).fill(-1));
      cats.forEach(([r, c], i) => reg[r][c] = i);
      let left = SIZE * SIZE - CATS;
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      while (left > 0) {
        const r = rnd(SIZE), c = rnd(SIZE);
        if (reg[r][c] !== -1) continue;
        const near = dirs.map(([dr, dc]) => [r + dr, c + dc])
          .filter(([nr, nc]) => nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && reg[nr][nc] !== -1);
        if (!near.length) continue;
        const [nr, nc] = near[rnd(near.length)];
        reg[r][c] = reg[nr][nc];
        left--;
      }
      return reg;
    }

    // Level rule: one colour is a single square (the starting cat). After the player
    // finds a cat and crosses every square the rules rule out, exactly one square
    // must be forced as the next cat, all the way to the last cat.
    function checkChain(reg, startIdx, cats) {
      const open = Array.from({ length: SIZE }, () => Array(SIZE).fill(true));
      const doneReg = new Set(), doneRow = new Set(), doneCol = new Set();
      const place = (r, c) => {
        const k = reg[r][c];
        doneReg.add(k); doneRow.add(r); doneCol.add(c);
        for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE; j++) {
          if (i === r || j === c || reg[i][j] === k || (Math.abs(i - r) <= 1 && Math.abs(j - c) <= 1)) open[i][j] = false;
        }
      };
      place(...cats[startIdx]);
      for (let step = 1; step < CATS; step++) {
        const byReg = {}, byRow = {}, byCol = {};
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
          if (!open[r][c]) continue;
          (byReg[reg[r][c]] ||= []).push([r, c]);
          (byRow[r] ||= []).push([r, c]);
          (byCol[c] ||= []).push([r, c]);
        }
        const forced = new Set();
        for (let k = 0; k < CATS; k++) {
          if (!doneReg.has(k)) { const l = byReg[k] || []; if (l.length === 0) return false; if (l.length === 1) forced.add(l[0].join()); }
          if (!doneRow.has(k)) { const l = byRow[k] || []; if (l.length === 0) return false; if (l.length === 1) forced.add(l[0].join()); }
          if (!doneCol.has(k)) { const l = byCol[k] || []; if (l.length === 0) return false; if (l.length === 1) forced.add(l[0].join()); }
        }
        if (forced.size !== 1) return false;
        const [r, c] = [...forced][0].split(',').map(Number);
        place(r, c);
      }
      return true;
    }

    function generate() {
      while (true) {
        const cats = placeCats();
        const startIdx = rnd(CATS);
        // start cat's colour is only its own square; the others grow to fill the rest
        const reg = growRegions(cats);
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
          if (reg[r][c] === startIdx && !(r === cats[startIdx][0] && c === cats[startIdx][1])) reg[r][c] = -1;
        }
        if (!refill(reg, startIdx)) continue;
        const sizes = Array(CATS).fill(0);
        for (const row of reg) for (const v of row) sizes[v]++;
        if (sizes.some((n, k) => k !== startIdx && n < 2)) continue;
        if (checkChain(reg, startIdx, cats)) return { cats, reg };
      }
    }

    // give squares freed from the start colour to neighbouring colours
    function refill(reg, startIdx) {
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      let left = 0;
      for (const row of reg) for (const v of row) if (v === -1) left++;
      let guard = 0;
      while (left > 0) {
        if (++guard > 5000) return false;
        const r = rnd(SIZE), c = rnd(SIZE);
        if (reg[r][c] !== -1) continue;
        const near = dirs.map(([dr, dc]) => [r + dr, c + dc])
          .filter(([nr, nc]) => nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && reg[nr][nc] !== -1 && reg[nr][nc] !== startIdx);
        if (!near.length) continue;
        const [nr, nc] = near[rnd(near.length)];
        reg[r][c] = reg[nr][nc];
        left--;
      }
      return true;
    }

    // ---------- game state ----------
    const board = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');

    let puzzle, isCat, state, score, misses, found, over;

    function newGame() {
      puzzle = generate();
      isCat = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
      puzzle.cats.forEach(([r, c]) => isCat[r][c] = true);
      state = Array.from({ length: SIZE }, () => Array(SIZE).fill('empty')); // empty | cross | cat | miss
      score = 0; misses = 0; found = 0; over = false;
      lastTap = null;
      overlay.classList.remove('show');
      buildBoard();
      render();
    }

    let cellEls = [];

    function buildBoard() {
      board.innerHTML = '';
      cellEls = [];
      for (let r = 0; r < SIZE; r++) {
        const row = [];
        for (let c = 0; c < SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = `cell r${puzzle.reg[r][c]}`;
          cell.dataset.r = r;
          cell.dataset.c = c;
          board.appendChild(cell);
          row.push(cell);
        }
        cellEls.push(row);
      }
    }

    function drawCell(r, c) {
      const cell = cellEls[r][c];
      const s = state[r][c];
      cell.classList.toggle('cat', s === 'cat');
      cell.classList.toggle('miss', s === 'miss');
      if (s === 'cat') cell.innerHTML = CAT_SVG;
      else if (s === 'cross') cell.innerHTML = CROSS_SVG('#6b4a3a');
      else if (s === 'miss') cell.innerHTML = CROSS_SVG('#e5485f');
      else cell.innerHTML = '';
    }

    function render() {
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) drawCell(r, c);
      drawHud();
    }

    function drawHud() {
      scoreEl.textContent = score;
      livesEl.innerHTML = Array.from({ length: MAX_MISSES }, (_, i) =>
        `<span class="${i < misses ? 'lost' : ''}">❤️</span>`).join('');
    }

    // Single tap toggles a cross straight away (no waiting).
    // A second tap on the same square within DOUBLE_TAP_MS undoes that toggle and guesses a cat.
    let lastTap = null;
    board.addEventListener('pointerdown', (e) => {
      if (over) return;
      const cell = e.target.closest('.cell');
      if (!cell) return;
      e.preventDefault();
      const r = +cell.dataset.r, c = +cell.dataset.c;
      cell.classList.add('pressed');
      setTimeout(() => cell.classList.remove('pressed'), 90);

      const now = performance.now();
      if (lastTap && lastTap.r === r && lastTap.c === c && now - lastTap.time < DOUBLE_TAP_MS) {
        state[r][c] = lastTap.before;
        lastTap = null;
        guess(r, c);
        return;
      }
      lastTap = { r, c, time: now, before: state[r][c] };
      // drag mode is decided by the first square: crossed -> remove crosses, anything else -> add crosses
      drag = {
        id: e.pointerId,
        mode: state[r][c] === 'cross' ? 'remove' : 'add',
        r, c,
        x: e.clientX, y: e.clientY,
      };
      singleTap(r, c);
    });

    // Drag: paint (or erase) crosses on every square the finger passes over.
    // Found cats and missed squares are left alone.
    let drag = null;

    function cellAt(x, y) {
      const el = document.elementFromPoint(x, y);
      const cell = el && el.closest ? el.closest('.cell') : null;
      return cell && board.contains(cell) ? [+cell.dataset.r, +cell.dataset.c] : null;
    }

    function paint(r, c) {
      const s = state[r][c];
      if (drag.mode === 'add' && s === 'empty') state[r][c] = 'cross';
      else if (drag.mode === 'remove' && s === 'cross') state[r][c] = 'empty';
      else return;
      drawCell(r, c);
    }

    window.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id || over) return;
      e.preventDefault();
      // sample along the path so fast swipes don't skip squares
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      const step = board.clientWidth / SIZE / 4;
      const n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / step));
      for (let i = 1; i <= n; i++) {
        const hit = cellAt(drag.x + dx * i / n, drag.y + dy * i / n);
        if (!hit) continue;
        const [r, c] = hit;
        if (r === drag.r && c === drag.c) continue;
        drag.r = r; drag.c = c;
        lastTap = null; // it's a drag now, not a tap
        paint(r, c);
      }
      drag.x = e.clientX; drag.y = e.clientY;
    }, { passive: false });

    const endDrag = (e) => { if (drag && e.pointerId === drag.id) drag = null; };
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    board.addEventListener('contextmenu', (e) => e.preventDefault());

    function singleTap(r, c) {
      const s = state[r][c];
      if (s === 'empty') state[r][c] = 'cross';
      else if (s === 'cross') state[r][c] = 'empty';
      else return;
      drawCell(r, c);
    }

    function guess(r, c) {
      const s = state[r][c];
      if (s === 'cat' || s === 'miss') return;
      if (isCat[r][c]) {
        state[r][c] = 'cat';
        score += POINTS_PER_CAT;
        found++;
      } else {
        state[r][c] = 'miss';
        misses++;
      }
      drawCell(r, c);
      drawHud();
      if (found === CATS) end(true);
      else if (misses >= MAX_MISSES) end(false);
    }

    function end(won) {
      over = true;
      if (!won) {
        puzzle.cats.forEach(([r, c]) => { if (state[r][c] !== 'cat') state[r][c] = 'cat'; });
        render();
      }
      setTimeout(() => {
        document.getElementById('ovTitle').textContent = won ? 'You found them all! 🐾' : 'Oh no! 😿';
        document.getElementById('ovText').textContent = won ? `Score: ${score}` : 'The cats stayed hidden.';
        overlay.classList.add('show');
      }, 700);
    }

    document.getElementById('again').addEventListener('click', newGame);
    newGame();
  </script>
</body>
</html>
