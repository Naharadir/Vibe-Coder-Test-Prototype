<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Horta Automática</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: wallet bar on top; a 4x4 field of plots with a farmer walking a serpentine path, next to an upgrades card (4 phase upgrades + walking speed). Stacks on phones. */
:root {
  --bg: #e8eee2;
  --panel: #f6f9f2;
  --fg: #1d2a1a;
  --muted: #59695a;
  --line: #cbd6c3;
  --grass: #a6cf86;
  --grass-2: #9dc87d;
  --dry: #cfae7c;
  --dry-edge: #ad8a58;
  --soil: #8a6040;
  --soil-edge: #5e3f27;
  --furrow: #7b5033;
  --leaf: #3c9a3b;
  --leaf-2: #2f7f30;
  --carrot: #f08a24;
  --gold: #e7a713;
  --gold-ink: #3a2700;
  --c0: #b8702f;
  --c1: #7fae2f;
  --c2: #2f86d0;
  --c3: #e7a713;
  --c4: #8a6fd1;
  --c5: #c8473a;
  --c6: #1fa39a;
  --c7: #c2549a;
  --track: rgba(30, 20, 10, 0.32);
  --shirt: #c8473a;
  --denim: #3d63a8;
  --straw: #e6c25a;
  --skin: #f0c29a;
  --boot: #4a3526;
  --can: #8fa6b8;
  --water: #2f86d0;
  --font-display: 'Bagel Fat One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a11;
    --panel: #1c2618;
    --fg: #e6efdf;
    --muted: #9fb094;
    --line: #2f3d2a;
    --grass: #2f4a27;
    --grass-2: #35542c;
    --dry: #7d6644;
    --dry-edge: #5d4a30;
    --soil: #52392a;
    --soil-edge: #2e1f15;
    --furrow: #4a3322;
    --leaf: #5cbd54;
    --leaf-2: #46a040;
    --carrot: #f59a3c;
    --gold: #f0b93a;
    --gold-ink: #2e1f00;
    --c0: #d98f4a;
    --c1: #9ccc52;
    --c2: #5aa9ee;
    --c3: #f0b93a;
    --c4: #a48df0;
    --c5: #e36a5c;
    --c6: #4cc9c0;
    --c7: #e57cbf;
    --track: rgba(0, 0, 0, 0.5);
    --shirt: #d9594b;
    --denim: #5b82c8;
    --straw: #e9cb6d;
    --can: #a6bccd;
    --water: #5aa9ee;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a11;
  --panel: #1c2618;
  --fg: #e6efdf;
  --muted: #9fb094;
  --line: #2f3d2a;
  --grass: #2f4a27;
  --grass-2: #35542c;
  --dry: #7d6644;
  --dry-edge: #5d4a30;
  --soil: #52392a;
  --soil-edge: #2e1f15;
  --furrow: #4a3322;
  --leaf: #5cbd54;
  --leaf-2: #46a040;
  --carrot: #f59a3c;
  --gold: #f0b93a;
  --gold-ink: #2e1f00;
  --c0: #d98f4a;
  --c1: #9ccc52;
  --c2: #5aa9ee;
  --c3: #f0b93a;
  --c4: #a48df0;
  --c5: #e36a5c;
  --c6: #4cc9c0;
  --c7: #e57cbf;
  --track: rgba(0, 0, 0, 0.5);
  --shirt: #d9594b;
  --denim: #5b82c8;
  --straw: #e9cb6d;
  --can: #a6bccd;
  --water: #5aa9ee;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  background: var(--bg);
  color: var(--fg);
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1020px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.5rem, 4.5vw, 2rem);
  line-height: 1.1;
  text-wrap: balance;
}
.wallet {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 16px 5px 7px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-family: var(--font-display);
  font-size: 1.45rem;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.wallet svg { width: 28px; height: 28px; flex: none; }
.wallet small { font-family: var(--font-body); font-size: 0.9rem; font-weight: 700; color: var(--muted); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.layout > * { min-width: 0; }
@media (max-width: 800px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.field-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
.field {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: clamp(5px, 1.4vw, 9px);
  padding: clamp(10px, 2.4vw, 16px);
  border-radius: 12px;
  background-color: var(--grass);
  background-image: repeating-linear-gradient(90deg, transparent 0 22px, var(--grass-2) 22px 24px);
}

/* ---- plot: layers from bottom to top = dry ground, plowed soil (wipes in), seeds (wipes in), wetness, crop, pips, bar ---- */
.plot {
  position: relative;
  aspect-ratio: 1;
  border-radius: 8px;
  background-color: var(--dry);
  box-shadow: inset 0 -5px 0 var(--dry-edge);
}
.dry, .seeds { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dry .crack { fill: none; stroke: var(--dry-edge); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.7; }
.dry .tuft { fill: var(--leaf); }
.till {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background-color: var(--soil);
  background-image: repeating-linear-gradient(180deg, transparent 0 10px, var(--furrow) 10px 13px);
  box-shadow: inset 0 -5px 0 var(--soil-edge);
  clip-path: inset(0 calc((1 - var(--till, 0)) * 100%) 0 0);
}
.seeds {
  opacity: var(--so, 1);
  clip-path: inset(0 calc((1 - var(--seed, 0)) * 100%) 0 0);
}
.seeds circle { fill: #ecd48f; stroke: #6b4a2a; stroke-width: 0.7; }
.wet { position: absolute; inset: 0; border-radius: inherit; background: var(--soil-edge); opacity: calc(var(--w, 0) * 0.38); pointer-events: none; }
.crop {
  position: absolute;
  left: 43%;
  bottom: 12%;
  width: 50%;
  aspect-ratio: 60 / 70;
  height: auto;
  overflow: visible;
  transform-origin: 50% 85.7%;
  transform: scale(var(--g, 0));
}
.crop .root { opacity: var(--r, 0); }
.plot[data-act="3"] .crop { animation: sway 0.5s ease-in-out infinite alternate; }
@keyframes sway { from { rotate: -3deg; } to { rotate: 3deg; } }

.pips { position: absolute; left: 6px; top: 6px; display: flex; gap: 3px; z-index: 2; }
.pips i { width: 7px; height: 7px; border-radius: 50%; background: var(--pc); opacity: 0.28; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35); }
.pips i:nth-child(1) { --pc: var(--c0); }
.pips i:nth-child(2) { --pc: var(--c1); }
.pips i:nth-child(3) { --pc: var(--c2); }
.pips i:nth-child(4) { --pc: var(--c3); }
.plot[data-stage="1"] .pips i:nth-child(-n+1),
.plot[data-stage="2"] .pips i:nth-child(-n+2),
.plot[data-stage="3"] .pips i:nth-child(-n+3) { opacity: 1; }

.bar { position: absolute; left: 6px; right: 6px; bottom: 5px; height: 6px; border-radius: 3px; background: var(--track); opacity: 0; transition: opacity 0.2s; z-index: 2; }
.plot[data-act] .bar { opacity: 1; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--c0); }
.plot[data-act="1"] .bar i { background: var(--c1); }
.plot[data-act="2"] .bar i { background: var(--c2); }
.plot[data-act="3"] .bar i { background: var(--c3); }

.crop .cr { display: none; }
.plot[data-crop="0"] .cr0 { display: inline; }
.plot[data-crop="1"] .cr1 { display: inline; }
.plot[data-crop="2"] .cr2 { display: inline; }
.plot[data-crop="3"] .cr3 { display: inline; }
.plot[data-crop="4"] .cr4 { display: inline; }
.plot[data-crop="5"] .cr5 { display: inline; }
.plot[data-crop="6"] .cr6 { display: inline; }
.plot[data-crop="7"] .cr7 { display: inline; }
.plot[data-crop="8"] .cr8 { display: inline; }
.plot[data-crop="9"] .cr9 { display: inline; }
.seedbox { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; }
.seedbox .sc { flex: 0 0 calc(20% - 5px); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--line); border-radius: 10px; padding: 6px 1px 4px; text-align: center; font-size: 0.62rem; font-weight: 600; color: var(--fg); }
.seedbox .sc svg { display: block; width: 28px; height: 33px; margin: 0 auto 2px; overflow: visible; }
.seedbox .sc .root { opacity: 1; }
.seedbox .sc.lock { color: var(--muted); }
.seedbox .sc.lock svg { filter: brightness(0); opacity: 0.25; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seedbox .sc.lock svg { filter: brightness(0) invert(1); opacity: 0.22; } }
:root[data-theme="dark"] .seedbox .sc.lock svg { filter: brightness(0) invert(1); opacity: 0.22; }
.plot[data-gold] .crop { filter: drop-shadow(0 0 5px rgba(255, 214, 74, 0.95)); }
.plot[data-gold] .crop .lf2 { fill: #d9a516; }
.plot[data-gold] .crop .lf { fill: #f5c935; }
.plot[data-gold] .crop .root { fill: #ffe27a; }
.spark { position: absolute; right: 7%; top: 9%; width: 20%; aspect-ratio: 1; z-index: 3; fill: #fff3b0; stroke: #e7a713; stroke-width: 1.5; stroke-linejoin: round; display: none; pointer-events: none; }
.plot[data-gold] .spark { display: block; animation: twinkle 1s ease-in-out infinite alternate; }
@keyframes twinkle { from { transform: scale(0.65) rotate(0deg); opacity: 0.7; } to { transform: scale(1.1) rotate(25deg); opacity: 1; } }
.pop.gold { font-size: 1.5rem; color: #ffd54a; animation-duration: 1.4s; }
.pop {
  position: absolute;
  left: 50%;
  top: 18%;
  z-index: 6;
  font-family: var(--font-display);
  font-size: 1.15rem;
  color: var(--gold);
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.55), 0 0 6px rgba(0, 0, 0, 0.3);
  pointer-events: none;
  white-space: nowrap;
  animation: pop 0.95s ease-out forwards;
}
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, 4px) scale(0.6); }
  20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -30px) scale(1); }
}

/* ---- farmer ---- */
.farmer { position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none; will-change: transform; }
.farmer.f1 { --shirt: #2f8f6b; }
.farmer.f2 { --shirt: #8a56c2; }
.farmer.f3 { --shirt: #2f7fc0; }
.farmer.f4 { --shirt: #d4821f; }
.farmer.f5 { --shirt: #1fa3a3; }
.farmer.f6 { --shirt: #b8438a; }
.farmer.f7 { --shirt: #6b7a8f; }
.farmer .face { width: 100%; height: 100%; transform: scaleX(var(--face, 1)); transform-origin: 50% 100%; }
.farmer .bob { width: 100%; height: 100%; }
.farmer svg { display: block; width: 100%; height: 100%; overflow: visible; }
.farmer.is-move .bob { animation: bob 0.28s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
.tool { display: none; transform-box: fill-box; transform-origin: 0% 100%; }
.farmer.tool-plow .t-plow, .farmer.tool-sow .t-sow, .farmer.tool-water .t-water, .farmer.tool-harvest .t-harvest { display: inline; }
.fx { display: none; }
.farmer.is-act .fx { display: inline; }
.farmer.is-act .t-plow { animation: hoe 0.6s ease-in infinite alternate; }
@keyframes hoe { from { transform: rotate(-22deg); } to { transform: rotate(34deg); } }
.farmer.is-act .t-sow { animation: shake 0.35s ease-in-out infinite alternate; }
@keyframes shake { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
.farmer.is-act .t-water { animation: tilt 1.1s ease-in-out infinite alternate; }
@keyframes tilt { from { transform: rotate(4deg); } to { transform: rotate(16deg); } }
.farmer.is-act .t-harvest { animation: swing 0.4s ease-in-out infinite alternate; }
@keyframes swing { from { transform: rotate(-55deg); } to { transform: rotate(25deg); } }
.drop { animation: fall 0.6s linear infinite; }
.drop:nth-child(2) { animation-delay: 0.2s; }
.drop:nth-child(3) { animation-delay: 0.4s; }
@keyframes fall { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(5px, 24px); opacity: 0; } }
.grain { animation: sprinkle 0.5s linear infinite; }
.grain:nth-child(2) { animation-delay: 0.17s; }
.grain:nth-child(3) { animation-delay: 0.34s; }
@keyframes sprinkle { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(-4px, 18px); opacity: 0; } }

.reset { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.reset button { font: 700 0.9rem var(--font-body); min-height: 44px; border-radius: 10px; cursor: pointer; padding: 8px 14px; }
.reset button:focus-visible { outline: 3px solid var(--water); outline-offset: 3px; }
.reset-btn { width: 100%; background: transparent; color: var(--muted); border: 1px solid var(--line); }
.reset-btn:hover { color: var(--fg); border-color: var(--muted); }
.reset-ask p { margin: 0 0 10px; font-size: 0.9rem; color: var(--fg); }
.reset-row { display: flex; gap: 8px; }
.reset-row button { flex: 1; }
.reset-yes { background: #c8473a; color: #fff; border: 0; }
.reset-no { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.reset-ask[hidden] { display: none; }
.plot[hidden], .up[hidden] { display: none; }
.tierb { position: absolute; right: 5px; top: 5px; z-index: 3; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--tc); color: #1b1200; font: 800 9px/15px var(--font-body); text-align: center; display: none; pointer-events: none; }
.plot[data-tier] .tierb { display: block; }
.plot[data-tier] { box-shadow: inset 0 -5px 0 var(--dry-edge), 0 0 0 2px var(--tc); }
.plot[data-tier="1"] { --tc: #cd7f32; }
.plot[data-tier="2"] { --tc: #b8c2cc; }
.plot[data-tier="3"] { --tc: #e7b923; }
.plot[data-tier="4"] { --tc: #1fb5a8; }
.plot[data-tier="5"] { --tc: #a45be0; }
.tip { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding: 9px 12px; border-radius: 10px; font-size: 0.88rem; line-height: 1.3; color: var(--fg); background: color-mix(in srgb, var(--c3) 16%, transparent); border: 1px solid var(--c3); }
.tip[hidden] { display: none; }
.tip .rip { position: relative; flex: none; width: 30px; height: 30px; }
.tip .rip i { position: absolute; inset: 0; border-radius: 50%; }
.tip .rip i:first-child { inset: 9px; background: var(--c3); }
.tip .rip i:last-child { border: 2px solid var(--c3); animation: ripple 1.2s ease-out infinite; }
@keyframes ripple { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.1); opacity: 0; } }
.plot.hint { animation: hintpulse 1.2s ease-in-out infinite; }
@keyframes hintpulse { 0%, 100% { outline: 3px solid rgba(255, 255, 255, 0.95); outline-offset: 1px; } 50% { outline: 3px solid rgba(255, 255, 255, 0.25); outline-offset: 5px; } }
@media (prefers-reduced-motion: reduce) { .tip .rip i:last-child, .plot.hint { animation: none; } .plot.hint { outline: 3px solid rgba(255, 255, 255, 0.9); } }
.plot.hold { outline: 3px solid rgba(255, 255, 255, 0.85); outline-offset: 1px; }
.plot.hold::before { content: ''; position: absolute; inset: 0; z-index: 4; pointer-events: none; border-radius: inherit;
  background: radial-gradient(circle at 50% 60%, rgba(190, 255, 150, 0.55), rgba(190, 255, 150, 0) 70%); animation: holdglow 0.5s ease-in-out infinite alternate; }
.plot.hold::after { content: ''; position: absolute; left: 10%; right: 10%; bottom: 8%; height: 70%; z-index: 4; pointer-events: none;
  background:
    radial-gradient(circle, #f4ffd0 0 2.5px, transparent 3px) 15% 100% / 28% 40% repeat-y,
    radial-gradient(circle, #b9f27a 0 2px, transparent 2.5px) 55% 100% / 33% 50% repeat-y,
    radial-gradient(circle, #fff 0 2px, transparent 2.5px) 85% 100% / 30% 35% repeat-y;
  animation: holdrise 0.7s linear infinite; }
@keyframes holdglow { from { opacity: 0.45; } to { opacity: 1; } }
@keyframes holdrise { from { background-position-y: 100%, 100%, 100%; transform: translateY(0); opacity: 1; } to { transform: translateY(-30%); opacity: 0; } }
.spark { top: 26%; }
.tierbuy { flex-direction: column; align-items: stretch; gap: 1px; margin-top: 6px; border-color: var(--c6); }
.tierbuy:not(:disabled) { background: color-mix(in srgb, var(--c6) 14%, transparent); }
.tb-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tb-p { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.tb-sub { font-size: 0.74rem; font-weight: 500; color: var(--muted); }

.field { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.plot { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.plot:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
.plot.tap { animation: tap 0.18s ease-out; }
@keyframes tap { 0% { transform: scale(1); } 40% { transform: scale(0.94); } 100% { transform: scale(1); } }

.plot.new { animation: rowin 0.6s ease-out; }
@keyframes rowin { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
.plot[data-grow] .bar { opacity: 1; height: 4px; bottom: 6px; }
.plot[data-grow] .bar i { background: var(--leaf); }
.plot[data-stage="4"] .pips i { opacity: 1; }
.plot[data-stage="4"]:not([data-act]) .crop { animation: sway 1.1s ease-in-out infinite alternate; }
.rowbuy {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 8px;
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 12px;
  border: 2px dashed var(--c3);
  background: transparent;
  color: var(--fg);
  font: 700 0.9rem var(--font-body);
  cursor: pointer;
}
.rowbuy:not(:disabled) { background: color-mix(in srgb, var(--c3) 14%, transparent); }
.rowbuy:disabled { border-color: var(--line); color: var(--muted); cursor: not-allowed; }
.rowbuy[hidden] { display: none; }
.rowbuy:focus-visible { outline: 3px solid var(--water); outline-offset: 3px; }
.rb-p { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.up-sub { font-size: 0.76rem; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.up-sub:empty { display: none; }
.up-stat:empty { display: none; }
.buy .bl:empty { display: none; }
#ups-phase, #ups-seeds, #ups-value, #ups-team { margin-top: 8px; }
.legend { margin: 12px 4px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 11px 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--muted);
  font-size: 0.85rem;
}
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--cc); }
.chip.on { color: var(--fg); font-weight: 700; border-color: var(--cc); box-shadow: 0 0 0 1px var(--cc); }
.status[hidden] { display: none; }
.status { margin: 8px 4px 2px; font-size: 0.92rem; color: var(--muted); min-height: 0; }

/* ---- shop ---- */
.shop { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.shop-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; line-height: 1.1; }
.rate { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sub { margin: 14px 0 2px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.up { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.up:last-child { border-bottom: 0; }
.up-name { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--uc); flex: none; }
.lv { font-family: var(--font-mono); font-weight: 400; font-size: 0.75rem; padding: 1px 7px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.up-stat { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.buy {
  min-width: 96px;
  min-height: 46px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px 12px;
  border: 0;
  border-radius: 12px;
  background: var(--gold);
  color: var(--gold-ink);
  font: 700 0.8rem/1.15 var(--font-body);
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.28);
  transition: transform 0.08s, box-shadow 0.08s;
}
.buy .price { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.buy:hover:not(:disabled) { filter: brightness(1.05); }
.buy:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.28); }
.buy:focus-visible { outline: 3px solid var(--water); outline-offset: 3px; }
.buy:disabled { background: var(--line); color: var(--muted); box-shadow: none; cursor: not-allowed; }


/* Telemóvel em vertical: o campo fica fixo em cima e só a lista de melhorias desliza */
@media (max-width: 800px) {
  body { padding-block: 10px 10px; }
  .app { height: calc(100dvh - 20px); gap: 8px; }
  h1 { font-size: 1.25rem; }
  .wallet { font-size: 1.25rem; padding: 4px 14px 4px 6px; }
  .wallet svg { width: 24px; height: 24px; }
  .layout { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
  .field-card { flex: none; padding: 8px; border-radius: 14px; }
  .field { padding: 8px; gap: 5px; }
  .legend { margin-top: 8px; gap: 4px; }
}
@media (max-width: 800px) and (max-height: 920px) {
  .legend { display: none; }
  .chip { font-size: 0.78rem; padding: 2px 9px 2px 7px; }
  .status { margin-top: 6px; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rowbuy { min-height: 40px; padding: 6px 12px; margin-top: 6px; }
  .tierbuy { padding: 5px 12px; }
  .tb-sub { font-size: 0.7rem; }
  .shop { flex: 1; min-height: 170px; overflow-y: auto; overscroll-behavior: contain; padding: 12px 14px; border-radius: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .farmer .bob, .tool, .drop, .grain, .spark, .plot[data-act="3"] .crop, .plot[data-stage="4"] .crop, .plot.new, .plot.tap, .plot.hold::before, .plot.hold::after { animation: none !important; }
}

  var VALUE_GAIN = 1.25;     // cada nível de Valor: +25% sobre o valor de cada legume (composto)

  var TOOL_COST = 40, TOOL_GROWTH = 1.35;
  // Tiers de talhão: cada talhão evolui de tier em tier (I a V). Mais dinheiro por colheita e fases mais rápidas nesse talhão.
  var MAX_TIER = 5, TIER_NAMES = ['I', 'II', 'III', 'IV', 'V'];
  var TIER_VALUE = 0.10, TIER_SPEED = 0; // por tier: +10% de dinheiro (a velocidade das fases vem só das Ferramentas)
  var TIER_BASE = 150, TIER_STEP = 25, TIER_K = 1.148; // custo do talhão k (0..23) no tier T: 150 × 25^(T−1) × 1,148^k
  // Legumes (10 por agora): o agricultor semeia um sorteado entre os desbloqueados. Só mudam no valor fixo (€) e na arte; tempos iguais.
  // Tudo sai de fórmulas para ser fácil juntar mais: valor 10 × 1,6^n · preço 2000 × 4^(n−1) · peso 0,6^n.
  var CROP_NAMES = ['Cenoura', 'Alface', 'Tomate', 'Abóbora', 'Batata', 'Milho', 'Beterraba', 'Pimento', 'Beringela', 'Melancia'];
  var CROP_V0 = 10, CROP_VGROWTH = 1.6, CROP_C1 = 2000, CROP_CGROWTH = 4, CROP_WDECAY = 0.6;
  var CROPS = CROP_NAMES.map(function (nm, n) {
    var raw = CROP_V0 * Math.pow(CROP_VGROWTH, n), mag = Math.pow(10, Math.floor(Math.log10(raw)) - 1); // valor com 2 algarismos significativos
    return { name: nm, value: Math.round(raw / mag) * mag, cost: n === 0 ? 0 : Math.round(CROP_C1 * Math.pow(CROP_CGROWTH, n - 1)) };
  });
  // Probabilidades (%) com n legumes desbloqueados: pesos 0,6^i normalizados — os antigos são sempre mais comuns.
  function cropOdds(n) {
    var w = [], t = 0, i;
    for (i = 0; i < n; i++) { w.push(Math.pow(CROP_WDECAY, i)); t += w[i]; }
    return w.map(function (x) { return 100 * x / t; });
  }
  var GROW_BASE = 40;        // segundos que a planta demora a crescer sozinha, nível 0
  var GROW_GAIN = 0.12;      // fertilizante: melhora devagar
  var GROW_COST = 50, GROW_GROWTH = 1.8; // e custa caro
  var FARMER_COSTS = [0, 20, 310, 2400, 12500, 62500]; // custo de contratar o 2.º … 6.º (índice = nº atual)
  var MAX_FARMERS = FARMER_COSTS.length;
  var AX = 0.2, AY = 0.8;    // onde o agricultor se põe dentro do talhão
  var KEY = 'horta-automatica-v2';

  // Estado de um talhão: 0 duro · 1 arado · 2 semeado · 3 a crescer sozinho · 4 pronto a colher.
  // O agricultor só trabalha nos estados 0, 1, 2 e 4. O 3 passa sozinho.
  var PHASES = [

  function fmt(n) { return n >= 100000 ? nfc.format(n) : nf0.format(n); }

  // ---------- estado ----------
  var money = 0, cells = START_CELLS;
  var levels = { tools: 0, walk: 0, value: 0, luck: 0, grow: 0 };
  var tutDone = false; // tutorial do toque: mostra-se depois da 1.ª colheita, até o jogador segurar uma planta a crescer
  var cropsOwned = 1; // quantas plantas já estão desbloqueadas (pela ordem de CROPS)
  var plotTier = [];
  for (var pt = 0; pt < NT; pt++) plotTier.push(0);
  var farmerCount = 1;
  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && isFinite(saved.money)) money = Math.max(0, Math.floor(saved.money));
    if (saved && saved.levels) {
      Object.keys(levels).forEach(function (k) {
        var v = saved.levels[k];
        if (isFinite(v)) levels[k] = Math.max(0, Math.floor(v));
      });
    }
    if (saved && Array.isArray(saved.plotTier)) {

    }

    if (saved && isFinite(saved.crops)) cropsOwned = clamp(Math.floor(saved.crops), 1, CROPS.length);
    if (saved && isFinite(saved.farmers)) farmerCount = clamp(Math.floor(saved.farmers), 1, MAX_FARMERS);
    // saves antigos tinham sempre 4 filas
    if (saved) {
      if (isFinite(saved.cells)) cells = clamp(Math.floor(saved.cells), START_CELLS, NT);
      else if (isFinite(saved.rows)) cells = clamp(Math.floor(saved.rows) * COLS, START_CELLS, NT); // versão com filas
      else cells = 16; // saves antigos tinham sempre 4 filas
    }
  } catch (e) { /* sem armazenamento: começa do zero */ }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ money: money, levels: levels, farmers: farmerCount, cells: cells, plotTier: plotTier, crops: cropsOwned, tut: tutDone ? 1 : 0 })); } catch (e) {}
  }

  function tierSpeed(t) { return 1 + TIER_SPEED * t; }
  function tierValue(t) { return 1 + TIER_VALUE * t; }
  function toolSpeedAt(l) { return 1 + TOOL_GAIN * l; }
  function phaseTime(i, idx) { return PHASES[i].base / (tierSpeed(plotTier[idx]) * toolSpeedAt(levels.tools)); } // tempo desta fase neste talhão
  function growTimeAt(l) { return GROW_BASE / (1 + GROW_GAIN * l); }
  function growTime() { return growTimeAt(levels.grow); }
  function speedAt(l) { return Math.min(WALK.cap, WALK.base + WALK.step * Math.min(l, WALK.max)); }
  function walkSpeed() { return speedAt(levels.walk); }
  function valueMultAt(l) { return Math.pow(VALUE_GAIN, l); }  // multiplicador do upgrade de Valor
  function harvestValue() { return valueMultAt(levels.value); }
  function luckAt(l) { return Math.min(LUCK_MAX, LUCK_BASE + LUCK_STEP * l); }
  function luckChance() { return luckAt(levels.luck); }
  function unlocked(idx) { return idx < cells; }
  var plotCrop = [];
  for (var pc = 0; pc < NT; pc++) plotCrop.push(0);

  var CROPS_ALL = CROP_SVG.map(function (d, i) { return '<g class="cr cr' + i + '">' + d + '</g>'; }).join('');

    '<span class="tierb"></span><div class="pips"><i></i><i></i><i></i><i></i></div><div class="bar"><i></i></div>';

  var plots = [], stages = [], claim = [], gold = [], growth = [], pp = [], tapLock = [], gameTime = 0;

  function initField() {
    for (var q = 0; q < NT; q++) {

    var live = [];
    for (var u = 0; u < NT; u++) if (unlocked(u)) live.push(u);
    if (stages.indexOf(4) < 0) stages[live[Math.floor(Math.random() * live.length)]] = 4; // pelo menos uma colheita à vista
    if (live.length === 1) { stages[live[0]] = 4; } // um só talhão: começa com o legume já crescido, pronto a colher
    for (var w = 0; w < NT; w++) {
      plotCrop[w] = pickCrop();
      if (stages[w] >= 2) gold[w] = Math.random() < luckChance();

  }
  initField();

  // Caminho em serpentina: linhas pares da esquerda para a direita, ímpares ao contrário.
  var order = [];
  for (var r = 0; r < MAX_ROWS; r++) {
    for (var k = 0; k < COLS; k++) {
      var c = r % 2 === 0 ? k : COLS - 1 - k;
      order.push(r * COLS + c);

  var M = { w: 80, l: 0, t: 0, sx: 90, sy: 90, fw: 40, fh: 53 };
  var farmers = [];
  function measure() {
    var a = plots[0].el;
    M.w = a.offsetWidth;
    M.l = a.offsetLeft;
    M.t = a.offsetTop;
    var gap = parseFloat(getComputedStyle(field).columnGap) || 0; // não depender de talhões escondidos
    M.sx = M.w + gap;
    M.sy = M.sx; // talhões quadrados, mesmo espaçamento nas duas direções
    M.fw = clamp(M.w * 0.5, 28, 58);
    M.fh = M.fw * 64 / 48;
    farmers.forEach(function (f) { f.el.style.width = M.fw + 'px'; f.el.style.height = M.fh + 'px'; });
  }
  measure();
  if (window.ResizeObserver) { new ResizeObserver(measure).observe(field); }
  window.addEventListener('resize', measure);

  function targetFor(idx) {
    var c = idx % COLS, rr = Math.floor(idx / COLS);
    return { x: c + AX * M.w / M.sx, y: rr + AY * M.w / M.sy };
  }

  // ---------- agricultores ----------
  // Cada um faz UMA fase por visita: chega, trabalha essa fase, e segue para o próximo talhão livre do caminho.
  // Dois agricultores nunca partilham um talhão, e talhões a crescer sozinhos são saltados.
  // Se não houver nada para fazer, o agricultor espera onde está.
  function addFarmer() {
    var id = farmers.length;
    var start = -1, bestGap = -1;
    for (var s = 0; s < NT; s++) {
      if (!unlocked(order[s])) continue;
      var gap = NT;
      farmers.forEach(function (o) {
        var d = Math.abs(o.seq - s); d = Math.min(d, NT - d);
        if (d < gap) gap = d;
      });
      if (gap > bestGap) { bestGap = gap; start = s; }
    }
    var el = farmerTpl.cloneNode(true);
    el.classList.add('f' + id);
    el.style.width = M.fw + 'px';
    el.style.height = M.fh + 'px';
    field.appendChild(el);
    var t = targetFor(order[start]);
    var f = {
      id: id, el: el, faceEl: el.querySelector('.face'),
      seq: id === 0 ? -1 : start - 1, target: -1, phase: 'move', prog: 0, face: 1, tool: 'plow',
      pos: { x: id === 0 ? t.x - 1 : -0.6, y: t.y },
      cls: '', shownFace: 0
    };
    farmers.push(f);
    return f;
  }

  function pickTarget(f) {
    for (var j = 1; j <= NT; j++) {
      var s = ((f.seq + j) % NT + NT) % NT;
      var idx = order[s];
      if (unlocked(idx) && claim[idx] === -1 && stages[idx] !== 3 && tapLock[idx] < gameTime) {
        f.seq = s; f.target = idx; claim[idx] = f.id;
        return true;
      }
    }
    return false;
  }

  // Conclui a fase atual de um talhão (usado pelos agricultores e pelos toques do jogador).
  function completeStage(idx, events) {
    var st = stages[idx];
    pp[idx] = 0;
    if (st === 4) {
      var v = Math.max(1, Math.round(CROPS[plotCrop[idx]].value * harvestValue() * tierValue(plotTier[idx])));
      var gd = gold[idx];
      if (gd) v *= GOLD_MULT;
      money += v;
      events.push({ idx: idx, v: v, gold: gd });
      gold[idx] = false;
      stages[idx] = 0;
    } else {
      if (st === 1) { gold[idx] = Math.random() < luckChance(); plotCrop[idx] = pickCrop(); } // sorteios ao semear
      if (st === 2) growth[idx] = 0;                           // a regar acabou: cresce sozinha
      stages[idx] = st + 1;
    }
  }

  function stepFarmer(f, dt, events) {
    var guard = 0;
    while (dt > 1e-9 && guard++ < 200000) {
      if (f.target >= 0 && stages[f.target] === 3) { // o jogador regou primeiro: esta planta já cresce sozinha
        claim[f.target] = -1; f.target = -1; f.phase = 'move';
      }
      if (f.target < 0 && !pickTarget(f)) return; // nada para fazer: espera
      var idx = f.target;
      if (f.phase === 'move') {
        var t = targetFor(idx);
        var dx = t.x - f.pos.x, dy = t.y - f.pos.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var sp = walkSpeed();
        var need = dist / sp;
        if (Math.abs(dx) > 0.001) f.face = dx > 0 ? 1 : -1;
        if (need <= dt) {
          f.pos.x = t.x; f.pos.y = t.y;
          dt -= need;
          f.phase = 'act'; f.face = 1;
        } else {
          f.pos.x += dx / dist * sp * dt;
          f.pos.y += dy / dist * sp * dt;
          dt = 0;
        }
      } else {
        var dur = phaseTime(phaseOf(stages[idx]), idx);
        var left = (1 - pp[idx]) * dur;
        if (left <= dt) {
          dt -= left;
          completeStage(idx, events);
          claim[idx] = -1; f.target = -1;
          f.phase = 'move';
        } else {
          pp[idx] += dt / dur;
          dt = 0;
        }
      }
    }
  }

  function tickGrowth(s) {
    var gt = growTime();
    for (var i = 0; i < NT; i++) {
      if (stages[i] === 3) {
        growth[i] += s / gt;
        if (growth[i] >= 1) { growth[i] = 0; stages[i] = 4; }
      }
    }
  }

  function advance(dt, events) {
    while (dt > 1e-9) {
      var s = dt > 0.5 ? 0.25 : dt;
      dt -= s;
      gameTime += s;
      for (var q = 0; q < farmers.length; q++) stepFarmer(farmers[q], s, events);
      tickGrowth(s);
    }
  }

  for (var n = 0; n < farmerCount; n++) addFarmer();

  // ---------- desenho ----------
  function applyPlot(p, stage, acting, pr, isGold, gr, tier, crop) {
    var till, seed = 0, so = 1, g = 0, root = 0, wet = 0;
    till = stage >= 1 ? 1 : (acting ? pr : 0);
    if (stage === 1) seed = acting ? pr : 0;
    else if (stage === 2) { seed = 1; so = acting ? Math.max(0, 1 - pr * 3) : 1; }
    if (stage === 2 && acting) { g = 0.12 + 0.22 * pr; wet = pr; }
    else if (stage === 3) { g = 0.34 + 0.66 * gr; root = clamp((gr - 0.6) / 0.4, 0, 1); wet = 1; }
    else if (stage === 4) { g = acting ? 1 - pr : 1; root = 1; wet = 1; }
    var s = p.el.style;
    s.setProperty('--till', till.toFixed(3));
    s.setProperty('--seed', seed.toFixed(3));
    s.setProperty('--so', so.toFixed(3));
    s.setProperty('--g', g.toFixed(3));
    s.setProperty('--r', root.toFixed(3));
    s.setProperty('--w', wet.toFixed(3));
    p.el.setAttribute('data-stage', stage);
    p.el.setAttribute('data-crop', crop);
    if (tier > 0) { p.el.setAttribute('data-tier', tier); p.badge.textContent = TIER_NAMES[tier - 1]; } else { p.el.removeAttribute('data-tier'); p.badge.textContent = ''; }
    if (isGold && (stage >= 3 || (stage === 2 && acting))) p.el.setAttribute('data-gold', ''); else p.el.removeAttribute('data-gold');
    if (acting) p.el.setAttribute('data-act', phaseOf(stage)); else p.el.removeAttribute('data-act');
    if (stage === 3) p.el.setAttribute('data-grow', ''); else p.el.removeAttribute('data-grow');
    p.fill.style.width = acting ? (pr * 100).toFixed(1) + '%' : (stage === 3 ? (gr * 100).toFixed(1) + '%' : '0%');
  }
  function spawnPop(plotEl, v, isGold) {

  function cellCost() { return cells >= NT ? Infinity : Math.max(1, Math.round(CELL_COST * Math.pow(CELL_GROWTH, cells - CELL_REF))); }
  rowBtn.addEventListener('click', function () {

    save();
    shopKey = '';
    refreshShop();

  var shopKey = '';
  function refreshShop() {
    var key = money + ':' + Object.keys(levels).map(function (k) { return levels[k]; }).join(',') + ':' + farmerCount + ':' + cells + ':' + cropsOwned + ':' + plotTier.join('');
    if (key === shopKey) return;
    shopKey = key;
    UPS.forEach(function (u) {
      var c = u.cost();
      u.lv.textContent = u.lvText();
      u.statEl.textContent = u.stat();
      if (u.sub) u.subEl.textContent = u.sub();
      if (c === Infinity) {
        u.price.textContent = 'Máximo';
        u.bl.textContent = '';
        u.btn.disabled = true;
        u.btn.setAttribute('aria-label', u.name + ': máximo atingido');
      } else {
        u.bl.textContent = '';
        u.price.textContent = fmt(c) + ' €';
        u.btn.disabled = money < c;
        u.btn.setAttribute('aria-label', u.label + ' ' + u.name + ' por ' + c + ' euros');
      }
    });
    CROPS.forEach(function (c, i) {
      var own = i < cropsOwned;
      seedCards[i].classList.toggle('lock', !own);
      seedCards[i].lastChild.textContent = own ? c.name : '?';
    });
    if (cropsOwned >= CROPS.length) {
      seedRow.hidden = true;
    } else {
      seedRow.hidden = false;
      var nc = CROPS[cropsOwned], nodds = cropOdds(cropsOwned + 1);
      seedName.textContent = nc.name;
      seedStat.textContent = fmt(nc.value) + ' € por colheita';
      seedSub.textContent = pct(nodds[cropsOwned]) + ' das colheitas';
      seedPrice.textContent = fmt(nc.cost) + ' €';
      seedBtn.disabled = money < nc.cost;
      seedBtn.setAttribute('aria-label', 'Desbloquear ' + nc.name + ' por ' + nc.cost + ' euros');
    }
    var rc = cellCost();
    rowBtn.hidden = rc === Infinity;
    if (rc !== Infinity) {
      rowBtn.querySelector('.rb-l').textContent = '＋ Novo talhão';
      rowBtn.querySelector('.rb-p').textContent = fmt(rc) + ' €';
      rowBtn.disabled = money < rc;
      rowBtn.setAttribute('aria-label', 'Comprar novo talhão por ' + rc + ' euros');
    }
    // botão de tier: evolui o próximo talhão pela ordem
    var mn = Math.min.apply(null, plotTier);
    tierNext = null;
    if (mn >= MAX_TIER) tierBtn.hidden = true;
    else {
      tierBtn.hidden = false;
      var T = mn + 1, ti = plotTier.indexOf(mn);
      var tc = Math.round(TIER_BASE * Math.pow(TIER_STEP, T - 1) * Math.pow(TIER_K, ti));
      tierNext = { i: ti, T: T, c: tc };
      tierBtn.querySelector('.tb-l').textContent = '⬆ Talhão ' + (ti + 1) + ' → Tier ' + TIER_NAMES[T - 1];
      tierBtn.querySelector('.tb-p').textContent = fmt(tc) + ' €';
      tierBtn.querySelector('.tb-sub').textContent = ti >= cells
        ? 'Compra primeiro o talhão ' + (ti + 1)
        : '+' + Math.round(TIER_VALUE * 100) + '% dinheiro · ' + ti + '/' + NT;
      tierBtn.disabled = ti >= cells || money < tc;
      tierBtn.setAttribute('aria-label', 'Evoluir talhão ' + (ti + 1) + ' para o tier ' + TIER_NAMES[T - 1] + ' por ' + tc + ' euros');
    }
    // estimativa: limitada pelos agricultores ou pelos talhões, o que for menor
    var sv = 0, ss = 0;
    for (var ci = 0; ci < cells; ci++) { sv += tierValue(plotTier[ci]); ss += tierSpeed(plotTier[ci]); }
    var sumT = PHASES.reduce(function (a, p) { return a + p.base; }, 0) / ((ss / cells) * toolSpeedAt(levels.tools));
    var mult = avgCropValue() * harvestValue() * (sv / cells) * (1 + luckChance() * (GOLD_MULT - 1)) * 60;
    var byFarmers = farmers.length * mult / (4 / walkSpeed() + sumT);
    var byPlots = cells * mult / (sumT + 4 / walkSpeed() + growTime()); // o talhão fica reservado enquanto o agricultor caminha até ele
    rateEl.textContent = fmt(Math.round(Math.min(byFarmers, byPlots))) + ' €/min';
  }

  // ---------- recomeçar ----------
  var resetBtn = $('reset'), resetAsk = $('resetAsk');
  resetBtn.addEventListener('click', function () { resetBtn.hidden = true; resetAsk.hidden = false; $('resetNo').focus(); });
  $('resetNo').addEventListener('click', function () { resetAsk.hidden = true; resetBtn.hidden = false; resetBtn.focus(); });
  $('resetYes').addEventListener('click', function () {
    money = 0; cells = START_CELLS; farmerCount = 1; cropsOwned = 1; tutDone = false; harvested = false;
    Object.keys(levels).forEach(function (k) { levels[k] = 0; });
    for (var z = 0; z < NT; z++) plotTier[z] = 0;
    hold.idx = -1;
    farmers.forEach(function (f) { if (f.el.parentNode) f.el.parentNode.removeChild(f.el); });
    farmers.length = 0;
    initField();
    addFarmer();
    shopKey = ''; shownMoney = -1; shownStatus = '';
    note.until = 0;
    save();
    resetAsk.hidden = true; resetBtn.hidden = false;
    refreshShop();
  });

  var harvested = money > 0, tipEl = $('tip'), hintIdx = -1;
  var shownMoney = -1, shownStatus = '', lastChips = '', holdShown = -1;
  var note = { text: '', until: 0 };

  function render(events, live, now) {
    // quem está a trabalhar em cada talhão
    var actProg = [];
    for (var i = 0; i < NT; i++) actProg.push(-1);
    var chipOn = [false, false, false, false], working = 0, idle = 0;
    farmers.forEach(function (f) {
      if (f.phase === 'act' && f.target >= 0) {
        actProg[f.target] = pp[f.target];
        chipOn[phaseOf(stages[f.target])] = true;
        working++;
      } else if (f.target < 0) idle++;
    });
    for (var m = 0; m < NT; m++) if (unlocked(m) && stages[m] !== 3 && pp[m] > 0 && actProg[m] < 0) actProg[m] = pp[m]; // trabalho do jogador a meio
    for (var j = 0; j < NT; j++) {
      if (!unlocked(j)) continue;
      var p = plots[j], a = actProg[j] >= 0, st = stages[j];
      var key = st + 'c' + plotCrop[j] + 't' + plotTier[j] + (gold[j] ? 'g' : '') + (a ? ':' + actProg[j].toFixed(3) : '') + (st === 3 ? ':' + growth[j].toFixed(3) : '');
      if (key !== p.key) { p.key = key; applyPlot(p, st, a, a ? actProg[j] : 0, gold[j], growth[j], plotTier[j], plotCrop[j]); }
    }
    if (live) {
      for (var e = 0; e < events.length && e < 4; e++) spawnPop(plots[events[e].idx].el, events[e].v, events[e].gold);
    }

    farmers.forEach(function (f) {
      var acting = f.phase === 'act';
      if (f.target >= 0) f.tool = TOOLS[phaseOf(stages[f.target])];
      var cls = 'farmer f' + f.id + ' tool-' + f.tool + (acting ? ' is-act' : (f.target < 0 ? ' is-idle' : ' is-move'));
      if (cls !== f.cls) { f.cls = cls; f.el.className = cls; }
      if (f.shownFace !== f.face) { f.shownFace = f.face; f.faceEl.style.setProperty('--face', f.face); }
      var px = M.l + f.pos.x * M.sx, py = M.t + f.pos.y * M.sy;
      f.el.style.transform = 'translate(' + (px - M.fw / 2).toFixed(1) + 'px,' + (py - M.fh).toFixed(1) + 'px)';
    });

    if (events.length) harvested = true;
    var wantIdx = -1;
    if (!tutDone && harvested) for (var hi = 0; hi < NT; hi++) if (unlocked(hi) && stages[hi] === 3) { wantIdx = hi; break; }
    if (wantIdx !== hintIdx) {
      if (hintIdx >= 0) plots[hintIdx].el.classList.remove('hint');
      hintIdx = wantIdx;
      if (hintIdx >= 0) plots[hintIdx].el.classList.add('hint');
      tipEl.hidden = hintIdx < 0;
    }
    if (holdShown !== hold.idx) { if (holdShown >= 0) plots[holdShown].el.classList.remove('hold'); holdShown = hold.idx; if (holdShown >= 0) plots[holdShown].el.classList.add('hold'); }
    var chipKey = chipOn.join();
    if (chipKey !== lastChips) {
      lastChips = chipKey;
      for (var q = 0; q < chips.length; q++) chips[q].classList.toggle('on', chipOn[q]);
    }

    if (money !== shownMoney) { shownMoney = money; moneyEl.textContent = fmt(money); }
    refreshShop();

    var text = now < note.until ? note.text : '';
    if (text !== shownStatus) { shownStatus = text; statusEl.textContent = text; statusEl.hidden = !text; }
  }


  // ---------- o jogador acelera o crescimento: segurar o dedo num talhão a crescer ----------
  // Só afeta plantas a crescer sozinhas (estado 3). Arar, semear, regar e colher continuam a ser dos agricultores.
  function holdWork(dt) {
    var idx = hold.idx;
    if (idx < 0) return;
    if (!unlocked(idx) || stages[idx] !== 3) { hold.idx = -1; return; } // já cresceu: o toque acaba
    growth[idx] += dt * HOLD_GROW_RATE / growTime();
    if (growth[idx] >= 1) { growth[idx] = 0; stages[idx] = 4; hold.idx = -1; }
  }
  function startHold(idx) {
    if (!unlocked(idx) || stages[idx] !== 3) return; // só planta a crescer
    hold.idx = idx;
    if (!tutDone) { tutDone = true; save(); }
    var el = plots[idx].el;
    el.classList.remove('tap'); void el.offsetWidth; el.classList.add('tap');
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  }
  function stopHold() { hold.idx = -1; }
  field.addEventListener('pointerdown', function (e) {
    var el = e.target.closest ? e.target.closest('.plot') : null;
    if (el) startHold(+el.getAttribute('data-i'));
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { field.addEventListener(t, stopHold); });
  window.addEventListener('blur', stopHold);
  field.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  field.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('plot')) {
      e.preventDefault(); if (hold.idx < 0) startHold(+e.target.getAttribute('data-i'));
    }
  });
  field.addEventListener('keyup', function (e) { if (e.key === 'Enter' || e.key === ' ') stopHold(); });

  // ---------- ciclo principal ----------
  var last = performance.now();
  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0;
    var away = dt > 1.5;
    if (dt > 28800) dt = 28800; // máximo 8 h offline
    var before = money;
    var events = [];
    advance(dt, events);
    if (!away) holdWork(Math.min(dt, 0.1));
    if (away && money > before) {
      note.text = 'Enquanto estiveste fora, ganhaste ' + fmt(money - before) + ' €.';
      note.until = now + 6000;
    }
    render(events, !away, now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setInterval(save, 4000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
})();
</script>

</body></html>
