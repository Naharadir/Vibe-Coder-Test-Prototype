<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estação Ecoponto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen portrait game — HUD strip on top, yard canvas in the middle, upgrade dock at the bottom.
   Single deliberate look (a sunny recycling yard), so colors are fixed, not theme-switched. */
:root{
  --yard:#cfd9c4;      /* compacted earth/grass yard */
  --yard-deep:#b7c6aa;
  --ink:#24322b;       /* deep green-black for text */
  --panel:#f6f4ec;     /* dock + HUD card */
  --vest:#f07a2a;      /* safety orange accent */
  --recycle:#2f8f5b;   /* recycling green */
  --trash:#8a8f8c;     /* grey trash */
  --muted:#6b7a70;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--yard);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.money{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;
  background:var(--panel);padding:8px 14px 8px 12px;border-radius:14px;box-shadow:0 3px 0 var(--yard-deep);display:flex;align-items:center;gap:8px}
.coin{width:22px;height:22px;border-radius:50%;background:#f4c542;box-shadow:inset 0 -3px 0 #d39b1d;display:inline-block}
.money.pop{animation:pop .25s ease}
@keyframes pop{50%{transform:scale(1.08)}}
.stats{font-size:.78rem;font-weight:800;color:var(--muted);text-align:right;line-height:1.35;text-transform:uppercase;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.stage{flex:1;min-height:0;position:relative}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.dock{background:var(--panel);border-radius:20px 20px 0 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));
  box-shadow:0 -4px 0 var(--yard-deep)}
.up{font:inherit;border:0;border-radius:14px;background:#fff;color:var(--ink);padding:9px 4px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 0 #d9d6c8;min-width:0}
.up:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #d9d6c8}
.up:focus-visible{outline:3px solid var(--vest);outline-offset:2px}
.up .ic{font-family:var(--display);font-size:1.15rem;font-weight:700;line-height:1}
.up .nm{font-size:.7rem;font-weight:800;line-height:1.15;text-align:center}
.up .lv{font-size:.62rem;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.up .pr{font-family:var(--display);font-size:.85rem;font-weight:600;background:var(--recycle);color:#fff;border-radius:8px;padding:1px 8px;font-variant-numeric:tabular-nums}
.up:disabled{opacity:.55;cursor:default}
.up:disabled .pr{background:var(--muted)}
.up.max .pr{background:var(--muted)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-bottom:30%;gap:10px;text-align:center;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.overlay h1{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:0;text-wrap:balance}
.overlay p{margin:0;max-width:30ch;color:var(--muted);font-weight:600}
.build{font-family:var(--display);font-weight:700;font-size:1.2rem;border:0;border-radius:16px;background:var(--vest);color:#fff;
  padding:14px 26px;box-shadow:0 5px 0 #b9541a;cursor:pointer;margin-top:6px}
.build:active{transform:translateY(3px);box-shadow:0 2px 0 #b9541a}
.build:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.money.pop{animation:none}}
</style>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="money" id="money"><span class="coin"></span><span id="moneyTxt">0</span></div>
    <div class="stats" id="stats">Lixo na área <b id="tCount">0/6</b><br>Recolhido <b id="tTotal">0</b></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay">
      <h1>Terreno vazio</h1>
      <p>Constrói a estação de reciclagem para começar a recolher lixo.</p>
      <button class="build" id="buildBtn">Construir estação</button>
    </div>
  </div>
  <div class="dock" id="dock"></div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

// ---------- tuning ----------
const G={
  phase:'empty',     // empty -> building -> running
  buildT:0,
  money:0, total:0,
  maxTrash:6, spawnEvery:2.2, spawnT:0.6,
  speed:0.22,        // in units of min(W,H) per second
  pickTime:1.6,      // seconds to pick up
  value:5,
  trash:[], workers:[], floats:[], dust:[],
  lv:{worker:1,speed:1,pick:1,area:1}
};
const UP={
  worker:{ic:'+1',nm:'Trabalhador',base:30,mult:1.9,max:6, apply(){addWorker()}},
  speed:{ic:'»',nm:'Velocidade',base:15,mult:1.6,max:10, apply(){G.speed*=1.15}},
  pick:{ic:'⟳',nm:'Recolha rápida',base:20,mult:1.65,max:10, apply(){G.pickTime*=0.85}},
  area:{ic:'▦',nm:'Mais lixo',base:25,mult:1.7,max:8, apply(){G.maxTrash+=2;G.spawnEvery*=0.85;G.value+=1}}
};
const cost=k=>Math.round(UP[k].base*Math.pow(UP[k].mult,G.lv[k]-1));

// ---------- geometry (normalized 0..1) ----------
const ZONE={x0:.12,x1:.88,y0:.10,y1:.56};
const BASE={x:.5,y:.74}; // door point workers leave from / return to
const S=()=>Math.min(W,H);

function addWorker(){
  const i=G.workers.length;
  const off=(i%2?1:-1)*Math.ceil(i/2)*0.07;
  G.workers.push({x:BASE.x+off,y:BASE.y,hx:BASE.x+off,hy:BASE.y,state:'idle',target:null,t:0,carry:false,face:1,bob:Math.random()*6});
}

function spawnTrash(){
  if(G.trash.length>=G.maxTrash) return;
  for(let n=0;n<12;n++){
    const x=ZONE.x0+Math.random()*(ZONE.x1-ZONE.x0), y=ZONE.y0+Math.random()*(ZONE.y1-ZONE.y0);
    if(G.trash.every(t=>Math.hypot((t.x-x)*W,(t.y-y)*H)>S()*0.07)){
      const pts=[];const k=7;for(let j=0;j<k;j++)pts.push(0.7+Math.random()*0.5);
      G.trash.push({x,y,claimed:null,pts,rot:Math.random()*6.28,born:0,shrink:1});
      return;
    }
  }
}

function nearestFree(w){
  let best=null,bd=1e9;
  for(const t of G.trash){ if(t.claimed) continue;
    const d=Math.hypot((t.x-w.x)*W,(t.y-w.y)*H); if(d<bd){bd=d;best=t;} }
  return best;
}

function moveTo(w,tx,ty,dt){
  const dx=(tx-w.x)*W, dy=(ty-w.y)*H, d=Math.hypot(dx,dy), step=G.speed*S()*dt;
  if(Math.abs(dx)>1) w.face=dx>0?1:-1;
  if(d<=step){w.x=tx;w.y=ty;return true;}
  w.x+=dx/d*step/W; w.y+=dy/d*step/H;
  if(Math.random()<dt*8) G.dust.push({x:w.x,y:w.y+0.012,life:.5});
  return false;
}

// ---------- update ----------
function update(dt){
  if(G.phase==='building'){ G.buildT+=dt; if(G.buildT>=1.4){G.phase='running';addWorker();} return; }
  if(G.phase!=='running') return;

  G.spawnT-=dt; if(G.spawnT<=0){spawnTrash();G.spawnT=G.spawnEvery*(0.7+Math.random()*0.6);}
  for(const t of G.trash) t.born=Math.min(1,t.born+dt*4);

  for(const w of G.workers){
    w.bob+=dt*12;
    if(w.state==='idle'){
      const t=nearestFree(w);
      if(t){t.claimed=w;w.target=t;w.state='going';}
      else moveTo(w,w.hx,w.hy,dt);
    } else if(w.state==='going'){
      if(moveTo(w,w.target.x,w.target.y+0.02,dt)){w.state='picking';w.t=0;}
    } else if(w.state==='picking'){
      w.t+=dt; w.target.shrink=1-0.6*(w.t/G.pickTime);
      if(w.t>=G.pickTime){G.trash.splice(G.trash.indexOf(w.target),1);w.target=null;w.carry=true;w.state='returning';}
    } else if(w.state==='returning'){
      if(moveTo(w,BASE.x,BASE.y,dt)){
        w.carry=false;G.money+=G.value;G.total++;
        G.floats.push({x:BASE.x,y:BASE.y-0.05,life:1,txt:'+'+G.value});
        bumpMoney(); w.state='idle';
      }
    }
  }
  for(const f of G.floats){f.life-=dt;f.y-=dt*0.06;}
  G.floats=G.floats.filter(f=>f.life>0);
  for(const d of G.dust) d.life-=dt; G.dust=G.dust.filter(d=>d.life>0);
}

// ---------- draw ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function drawYard(){
  ctx.fillStyle='#cfd9c4';ctx.fillRect(0,0,W,H);
  // pebble texture (deterministic)
  ctx.fillStyle='#bfcbb3';
  for(let i=0;i<70;i++){const a=Math.sin(i*91.7)*43758.5, b=Math.sin(i*12.9)*24634.6;
    const x=(a-Math.floor(a))*W, y=(b-Math.floor(b))*H; ctx.beginPath();ctx.ellipse(x,y,3,2,0,0,7);ctx.fill();}
  // collection zone
  const zx=ZONE.x0*W, zy=ZONE.y0*H, zw=(ZONE.x1-ZONE.x0)*W, zh=(ZONE.y1-ZONE.y0)*H;
  rr(zx-12,zy-12,zw+24,zh+24,18); ctx.fillStyle='rgba(183,198,170,.55)'; ctx.fill();
  ctx.setLineDash([8,8]);ctx.lineWidth=2;ctx.strokeStyle='#9fb093';ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#8b9c80';ctx.font='800 10px Nunito, sans-serif';ctx.textAlign='left';
  ctx.fillText('ZONA DE DESCARGA',zx-4,zy-18);
  // path to station
  ctx.fillStyle='#c3cdb7';rr(BASE.x*W-S()*0.07,(ZONE.y1)*H+12,S()*0.14,(BASE.y-ZONE.y1)*H,8);ctx.fill();
}

function drawStation(p){ // p: build progress 0..1
  const cx=BASE.x*W, s=S(), bw=s*0.62, bh=s*0.22, by=BASE.y*H+4, bx=cx-bw/2;
  if(G.phase==='empty'){ // blueprint
    ctx.setLineDash([6,6]);ctx.lineWidth=2;ctx.strokeStyle='#7d8f76';rr(bx,by,bw,bh,12);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#7d8f76';ctx.font='800 11px Nunito, sans-serif';ctx.textAlign='center';ctx.fillText('LOTE DA ESTAÇÃO',cx,by+bh/2+4);return;
  }
  const e=1-Math.pow(1-p,3), h=bh*e, top=by+bh-h;
  ctx.save();ctx.beginPath();ctx.rect(bx-20,top-s*0.2,bw+40,h+s*0.2);ctx.clip();
  // shadow
  ctx.fillStyle='rgba(36,50,43,.15)';rr(bx+6,by+10,bw,bh,14);ctx.fill();
  // body
  ctx.fillStyle='#2f8f5b';rr(bx,by,bw,bh,14);ctx.fill();
  ctx.fillStyle='#277a4d';rr(bx,by+bh*0.62,bw,bh*0.38,[0,0,14,14]);ctx.fillRect(bx,by+bh*0.62,bw,bh*0.38);
  // roof band
  ctx.fillStyle='#f6f4ec';rr(bx+10,by+8,bw-20,bh*0.22,6);ctx.fill();
  ctx.fillStyle='#2f8f5b';ctx.font='700 '+Math.round(bh*0.16)+'px Fredoka, sans-serif';ctx.textAlign='center';
  ctx.fillText('ECOPONTO',cx,by+8+bh*0.17);
  // door / intake
  const dw=bw*0.2, dh=bh*0.5;
  ctx.fillStyle='#1d3b2b';rr(cx-dw/2,by+bh-dh,dw,dh,[8,8,0,0]);ctx.fillRect(cx-dw/2,by+bh-dh*0.6,dw,dh*0.6);
  for(let i=1;i<4;i++){ctx.fillStyle='#2a4d39';ctx.fillRect(cx-dw/2+3,by+bh-dh+i*dh/4,dw-6,2);}
  // bins
  const bins=['#3a7bd5','#f4c542','#2f8f5b'];
  bins.forEach((c,i)=>{const x=bx+14+i*(s*0.05);const y=by+bh*0.42;ctx.fillStyle=c;rr(x,y,s*0.04,bh*0.42,4);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x,y,s*0.04,4);});
  // machine with gear
  const mx=bx+bw-s*0.15, my=by+bh*0.38;
  ctx.fillStyle='#d6d9d2';rr(mx,my,s*0.12,bh*0.5,6);ctx.fill();
  const gx=mx+s*0.06, gy=my+bh*0.25, gr=bh*0.14, ang=performance.now()/600*(G.workers.some(w=>w.carry)?2:0.6);
  ctx.save();ctx.translate(gx,gy);ctx.rotate(ang);ctx.fillStyle='#6b7a70';
  for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.fillRect(-gr*0.22,-gr*1.25,gr*0.44,gr*0.5);}
  ctx.beginPath();ctx.arc(0,0,gr,0,7);ctx.fill();ctx.fillStyle='#d6d9d2';ctx.beginPath();ctx.arc(0,0,gr*0.4,0,7);ctx.fill();ctx.restore();
  // chimney puff
  ctx.restore();
  if(G.phase==='building'){ // scaffolding sparkle
    ctx.strokeStyle='#f07a2a';ctx.lineWidth=3;
    for(let i=0;i<=4;i++){const x=bx+i*bw/4;ctx.beginPath();ctx.moveTo(x,by+bh);ctx.lineTo(x,top);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(bx,top);ctx.lineTo(bx+bw,top);ctx.stroke();
  }
}

function drawTrash(t){
  const x=t.x*W, y=t.y*H, r=S()*0.022*t.born*t.shrink;
  ctx.fillStyle='rgba(36,50,43,.15)';ctx.beginPath();ctx.ellipse(x,y+r*0.8,r*1.1,r*0.4,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(t.rot);
  ctx.beginPath();const k=t.pts.length;
  for(let i=0;i<k;i++){const a=i/k*6.283, rr=r*t.pts[i];ctx[i?'lineTo':'moveTo'](Math.cos(a)*rr,Math.sin(a)*rr);}
  ctx.closePath();ctx.fillStyle='#8a8f8c';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#6f7471';ctx.stroke();
  ctx.fillStyle='#a6aba8';ctx.beginPath();ctx.arc(-r*0.25,-r*0.25,r*0.25,0,7);ctx.fill();
  ctx.restore();
}

function drawWorker(w){
  const x=w.x*W, y=w.y*H, s=S()*0.03, moving=w.state==='going'||w.state==='returning'||(w.state==='idle'&&Math.hypot(w.x-w.hx,w.y-w.hy)>0.002);
  const b=moving?Math.abs(Math.sin(w.bob))*s*0.25:0;
  ctx.fillStyle='rgba(36,50,43,.2)';ctx.beginPath();ctx.ellipse(x,y+s*0.9,s*0.8,s*0.3,0,0,7);ctx.fill();
  // legs
  ctx.fillStyle='#24322b';
  const sw=moving?Math.sin(w.bob)*s*0.25:0;
  ctx.fillRect(x-s*0.35+sw,y+s*0.2-b,s*0.25,s*0.65);ctx.fillRect(x+s*0.1-sw,y+s*0.2-b,s*0.25,s*0.65);
  // body (vest)
  ctx.fillStyle='#f07a2a';rr(x-s*0.55,y-s*0.6-b,s*1.1,s*0.95,s*0.3);ctx.fill();
  ctx.fillStyle='#f6f4ec';ctx.fillRect(x-s*0.55,y-s*0.15-b,s*1.1,s*0.14);
  // head + helmet
  ctx.fillStyle='#e8b98f';ctx.beginPath();ctx.arc(x,y-s*0.95-b,s*0.38,0,7);ctx.fill();
  ctx.fillStyle='#f4c542';ctx.beginPath();ctx.arc(x,y-s*1.02-b,s*0.42,Math.PI,0);ctx.fill();ctx.fillRect(x-s*0.5,y-s*1.04-b,s*1,s*0.1);
  ctx.fillStyle='#24322b';ctx.beginPath();ctx.arc(x+w.face*s*0.15,y-s*0.9-b,s*0.06,0,7);ctx.fill();
  // carried bag
  if(w.carry){ctx.fillStyle='#8a8f8c';ctx.beginPath();ctx.ellipse(x+w.face*s*0.75,y-s*0.35-b,s*0.4,s*0.45,0,0,7);ctx.fill();
    ctx.strokeStyle='#6f7471';ctx.lineWidth=1.5;ctx.stroke();}
  // pickup progress ring
  if(w.state==='picking'){
    const p=w.t/G.pickTime, r=s*1.5, cy=y-s*2.2;
    ctx.fillStyle='rgba(246,244,236,.95)';ctx.beginPath();ctx.arc(x,cy,r*0.55,0,7);ctx.fill();
    ctx.lineWidth=4;ctx.strokeStyle='#d9d6c8';ctx.beginPath();ctx.arc(x,cy,r*0.55,0,7);ctx.stroke();
    ctx.strokeStyle='#2f8f5b';ctx.beginPath();ctx.arc(x,cy,r*0.55,-Math.PI/2,-Math.PI/2+p*6.283);ctx.stroke();
    // little arm motion
    ctx.fillStyle='#f07a2a';const a=Math.sin(w.t*14)*s*0.2;ctx.fillRect(x+w.face*s*0.45,y-s*0.3+a,s*0.35*w.face,s*0.18);
  }
}

function draw(){
  drawYard();
  const p=G.phase==='building'?G.buildT/1.4:1;
  drawStation(p);
  for(const d of G.dust){ctx.fillStyle=`rgba(160,150,120,${d.life})`;ctx.beginPath();ctx.arc(d.x*W,d.y*H,(1-d.life)*6+2,0,7);ctx.fill();}
  // depth sort
  const objs=[...G.trash.map(t=>({y:t.y,f:()=>drawTrash(t)})),...G.workers.map(w=>({y:w.y,f:()=>drawWorker(w)}))].sort((a,b)=>a.y-b.y);
  objs.forEach(o=>o.f());
  ctx.textAlign='center';
  for(const f of G.floats){ctx.globalAlpha=Math.min(1,f.life*2);ctx.font='700 '+Math.round(S()*0.055)+'px Fredoka, sans-serif';
    ctx.lineWidth=4;ctx.strokeStyle='#f6f4ec';ctx.strokeText(f.txt+' €',f.x*W,f.y*H);ctx.fillStyle='#2f8f5b';ctx.fillText(f.txt+' €',f.x*W,f.y*H);}
  ctx.globalAlpha=1;
}

// ---------- UI ----------
const dock=document.getElementById('dock'), moneyTxt=document.getElementById('moneyTxt'), moneyEl=document.getElementById('money');
const btns={};
for(const k in UP){
  const b=document.createElement('button');b.className='up';b.id='up-'+k;
  b.innerHTML=`<span class="ic">${UP[k].ic}</span><span class="nm">${UP[k].nm}</span><span class="lv"></span><span class="pr"></span>`;
  b.addEventListener('click',()=>{
    if(G.phase!=='running'||G.lv[k]>=UP[k].max)return; const c=cost(k); if(G.money<c)return;
    G.money-=c;G.lv[k]++;UP[k].apply();refreshUI(true);
  });
  dock.appendChild(b);btns[k]=b;
}
function bumpMoney(){moneyEl.classList.remove('pop');void moneyEl.offsetWidth;moneyEl.classList.add('pop');}
let lastKey='';
function refreshUI(force){
  const key=[Math.floor(G.money),G.trash.length,G.maxTrash,G.total,G.phase,...Object.values(G.lv)].join();
  if(key===lastKey&&!force)return; lastKey=key;
  moneyTxt.textContent=Math.floor(G.money)+' €';
  document.getElementById('tCount').textContent=G.trash.length+'/'+G.maxTrash;
  document.getElementById('tTotal').textContent=G.total;
  for(const k in UP){const b=btns[k],max=G.lv[k]>=UP[k].max,c=cost(k);
    b.querySelector('.lv').textContent=k==='worker'?G.workers.length+' na equipa':'nível '+G.lv[k];
    b.querySelector('.pr').textContent=max?'MÁX':c+' €';
    b.classList.toggle('max',max);
    b.disabled=G.phase!=='running'||max||G.money<c;}
}

document.getElementById('buildBtn').addEventListener('click',()=>{
  document.getElementById('overlay').hidden=true;G.phase='building';G.buildT=0;
});

let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();refreshUI();requestAnimationFrame(loop);}
refreshUI(true);requestAnimationFrame(loop);
